name: Core and application host

on:
  push:
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-foundation-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"

jobs:
  linux:
    name: Linux / ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: GCC Debug
            compiler: g++
            config: Debug
            sanitize: "OFF"
            system: Linux
          - label: GCC Release
            compiler: g++
            config: Release
            sanitize: "OFF"
            system: Linux
          - label: Clang Debug
            compiler: clang++
            config: Debug
            sanitize: "OFF"
            system: Linux
          - label: Clang ASan UBSan
            compiler: clang++
            config: Debug
            sanitize: "ON"
            system: Linux
          - label: GCC Generic
            compiler: g++
            config: Release
            sanitize: "OFF"
            system: Generic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Configure
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_SYSTEM_NAME=${{ matrix.system }}
          -DECU_APP_SANITIZERS=${{ matrix.sanitize }}
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Verify offline
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build/ci --output-on-failure --no-tests=error
      - name: Inspect uninstrumented Core
        if: matrix.sanitize == 'OFF'
        run: python tools/check_core_binary.py build/ci

  windows:
    name: MSVC / ${{ matrix.arch }} / ${{ matrix.config }}
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [Win32, x64]
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Configure
        run: cmake -S . -B build/ci -G "Visual Studio 17 2022" -A ${{ matrix.arch }}
      - name: Build
        run: cmake --build build/ci --config ${{ matrix.config }} --parallel 2
      - name: Verify offline
        run: ctest --test-dir build/ci -C ${{ matrix.config }} --output-on-failure --no-tests=error
